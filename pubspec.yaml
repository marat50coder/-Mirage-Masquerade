name: mirage_masquerade
description: "Mirage Masquerade - synchronise three parallel theatres of illusion."
publish_to: 'none'
version: 1.0.1+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.5
  audioplayers: ^6.1.0
  webview_flutter: ^4.14.1
  webview_flutter_wkwebview: ^3.26.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/img/obj/
    - assets/img/fx/
    - assets/img/ui/
    - assets/img/bg/
    - assets/img/screen/
    - assets/sfx/
